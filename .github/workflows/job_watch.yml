name: Daily Job Watch

on:
  schedule:
    - cron: "0 22 * * *"
  workflow_dispatch:

concurrency:
  group: daily-job-watch
  cancel-in-progress: false

permissions:
  contents: write
  pull-requests: write

jobs:
  watch:
    runs-on: ubuntu-latest

    steps:
      - name: Check out repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install dependencies
        run: pip install -r requirements.txt

      - name: Run daily watch
        env:
          SMTP_HOST: ${{ secrets.SMTP_HOST }}
          SMTP_PORT: ${{ secrets.SMTP_PORT }}
          SMTP_USERNAME: ${{ secrets.SMTP_USERNAME }}
          SMTP_PASSWORD: ${{ secrets.SMTP_PASSWORD }}
          EMAIL_FROM: ${{ secrets.EMAIL_FROM }}
          EMAIL_TO: ${{ secrets.EMAIL_TO }}
        run: python watch/run_daily_watch.py

      - name: Create pull request for watch updates
        uses: peter-evans/create-pull-request@v6
        with:
          branch: "automation/daily-job-watch"
          delete-branch: true
          commit-message: "chore(job-watch): update daily snapshot"
          title: "chore(job-watch): update daily snapshot"
          body: |
            Automated daily job watch update.

            Updated paths:
            - `market_watch/discovered_roles.md`
            - `market_watch/alerts.md`
            - `watch/state/seen_jobs.json`
            - `watch/state/latest_digest.md`
          add-paths: |
            market_watch/discovered_roles.md
            market_watch/alerts.md
            watch/state/seen_jobs.json
            watch/state/latest_digest.md
